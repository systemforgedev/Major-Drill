[project]
name = "wtmate"
version = "0.1.0"
description = "Screen-only game teammate: Drill gives fast calls from protocols, Major reviews your matches."
requires-python = ">=3.11"
dependencies = ["pillow", "numpy"]

[project.optional-dependencies]
live = ["mss", "pyttsx3"]
ocr = ["pytesseract"]
cloud = ["anthropic>=0.80"]
dev = ["pytest"]

[project.scripts]
wtmate = "wtmate.cli:main"

[tool.setuptools]
packages = ["wtmate"]

[tool.setuptools.package-data]
wtmate = ["assets/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
