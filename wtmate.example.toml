# Copy to wtmate.toml and edit. Every key is optional.

player_name = ""          # your in-game name (helps spot your kills and deaths in live mode)
matches_dir = "matches"

# --- Major: the post-match reviewer (base tier, works for everyone) ---------
# Cloud (default): strong and needs no GPU. Needs ANTHROPIC_API_KEY.
[deep]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000
# Local instead (slow is fine after a match). Any OpenAI-style server works:
# provider = "openai_compat"
# base_url = "http://127.0.0.1:11434/v1"     # Ollama
# model = "qwen3-vl:8b"

# --- Drill: the fast frame reader -------------------------------------------
# In base tier Drill reads your recording frame by frame (batched, cheap).
# In live mode it has to answer in ~1-2 s while the game is running.
[fast]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4000
# Local example (Ollama: `ollama pull qwen3-vl:4b`, about 3.3 GB at 4-bit):
# provider = "openai_compat"
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen3-vl:4b"

[ingest]
frame_every_s = 3.0       # lower = more detail, more cost
max_width = 1280
batch_size = 8

[live]
frame_every_s = 1.5
min_gap_s = 6.0
repeat_gap_s = 20.0
min_confidence = 0.6
max_latency_s = 3.0
record_video = true

[telemetry]               # the game's own local map page, live mode only
enabled = true
url = "http://127.0.0.1:8111"

[voice]
enabled = true
rate = 190

